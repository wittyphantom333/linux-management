name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build and Upload Binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: 'amd64'
          - goos: linux
            goarch: 'arm64'
          - goos: linux
            goarch: 'arm'
          - goos: linux
            goarch: '386'
          - goos: freebsd
            goarch: 'amd64'
          - goos: freebsd
            goarch: 'arm64'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Download dependencies
        run: go mod download

      - name: Extract version
        id: version
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarch == 'arm' && '6' || '' }}
          CGO_ENABLED: 0
        run: |
          OUTPUT_NAME="patchmon-agent-${{ matrix.goos }}-${{ matrix.goarch }}"
          go build -buildvcs=false \
            -ldflags="-s -w -X patchmon-agent/internal/pkgversion.Version=${{ steps.version.outputs.version }}" \
            -o "${OUTPUT_NAME}" ./cmd/patchmon-agent

      - name: Upload binary to release
        uses: softprops/action-gh-release@v2
        with:
          files: patchmon-agent-${{ matrix.goos }}-${{ matrix.goarch }}
