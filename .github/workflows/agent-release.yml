name: Agent Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build Agent Binary (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: 'amd64'
          - goos: linux
            goarch: 'arm64'
          - goos: linux
            goarch: 'arm'
          - goos: linux
            goarch: '386'
          - goos: freebsd
            goarch: 'amd64'
          - goos: freebsd
            goarch: 'arm64'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'agent-source-code/go.mod'

      - name: Download dependencies
        working-directory: agent-source-code
        run: go mod download

      - name: Extract version
        id: version
        run: |
          # Strip leading 'v' from tag for the Go version string
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build binary
        working-directory: agent-source-code
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarch == 'arm' && '6' || '' }}
          CGO_ENABLED: 0
        run: |
          OUTPUT_NAME="patchmon-agent-${{ matrix.goos }}-${{ matrix.goarch }}"
          go build -buildvcs=false \
            -ldflags="-s -w -X patchmon-agent/internal/pkgversion.Version=${{ steps.version.outputs.version }}" \
            -o "${OUTPUT_NAME}" ./cmd/patchmon-agent

      - name: Verify binary exists and is executable
        working-directory: agent-source-code
        run: |
          OUTPUT_NAME="patchmon-agent-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ ! -f "${OUTPUT_NAME}" ]; then
            echo "❌ Error: Binary ${OUTPUT_NAME} was not created"
            exit 1
          fi
          chmod +x "${OUTPUT_NAME}"
          ls -lh "${OUTPUT_NAME}"
          file "${OUTPUT_NAME}"
          echo "✅ Binary ${OUTPUT_NAME} created successfully"

      - name: Test binary (linux/amd64 only)
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        working-directory: agent-source-code
        run: |
          OUTPUT_NAME="patchmon-agent-${{ matrix.goos }}-${{ matrix.goarch }}"
          ./"${OUTPUT_NAME}" --version || ./"${OUTPUT_NAME}" version || echo "Version command not available (may require config)"

      - name: Upload binary to release
        working-directory: agent-source-code
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OUTPUT_NAME="patchmon-agent-${{ matrix.goos }}-${{ matrix.goarch }}"
          echo "📤 Uploading ${OUTPUT_NAME} to release ${{ github.event.release.tag_name }}..."
          gh release upload "${{ github.event.release.tag_name }}" "${OUTPUT_NAME}" --repo "${{ github.repository }}" --clobber
          echo "✅ Uploaded ${OUTPUT_NAME}"

