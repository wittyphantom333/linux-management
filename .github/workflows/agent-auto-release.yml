name: Auto-Create Agent Release

on:
  push:
    branches: [main, development]
    paths:
      - 'agent-source-code/internal/pkgversion/version.go'

permissions:
  contents: write

jobs:
  check-and-release:
    name: Detect Version Change
    runs-on: ubuntu-latest

    outputs:
      should_release: ${{ steps.check_tag.outputs.should_release }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # Need full history for tag comparison

      - name: Extract version from source
        id: version
        run: |
          VERSION=$(grep -oP 'var Version = "\K[^"]+' agent-source-code/internal/pkgversion/version.go)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Detected version: ${VERSION} (tag: v${VERSION})"

      - name: Check if tag already exists
        id: check_tag
        run: |
          if git rev-parse "refs/tags/${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "Tag ${{ steps.version.outputs.tag }} already exists — skipping"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "Tag ${{ steps.version.outputs.tag }} is new — will create release"
          fi

  build:
    name: Build Agent (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: check-and-release
    if: needs.check-and-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: 'amd64'
          - goos: linux
            goarch: 'arm64'
          - goos: linux
            goarch: 'arm'
          - goos: linux
            goarch: '386'
          - goos: freebsd
            goarch: 'amd64'
          - goos: freebsd
            goarch: 'arm64'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'agent-source-code/go.mod'

      - name: Download dependencies
        working-directory: agent-source-code
        run: go mod download

      - name: Build binary
        working-directory: agent-source-code
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarch == 'arm' && '6' || '' }}
          CGO_ENABLED: 0
        run: |
          OUTPUT_NAME="patchmon-agent-${{ matrix.goos }}-${{ matrix.goarch }}"
          go build -buildvcs=false \
            -ldflags="-s -w -X patchmon-agent/internal/pkgversion.Version=${{ needs.check-and-release.outputs.version }}" \
            -o "${OUTPUT_NAME}" ./cmd/patchmon-agent

      - name: Verify binary
        working-directory: agent-source-code
        run: |
          OUTPUT_NAME="patchmon-agent-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ ! -f "${OUTPUT_NAME}" ]; then
            echo "❌ Error: Binary ${OUTPUT_NAME} was not created"
            exit 1
          fi
          chmod +x "${OUTPUT_NAME}"
          ls -lh "${OUTPUT_NAME}"
          file "${OUTPUT_NAME}"
          echo "✅ Binary ${OUTPUT_NAME} created successfully"

      - name: Test binary (linux/amd64 only)
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        working-directory: agent-source-code
        run: |
          OUTPUT_NAME="patchmon-agent-${{ matrix.goos }}-${{ matrix.goarch }}"
          ./"${OUTPUT_NAME}" --version || ./"${OUTPUT_NAME}" version || echo "Version command not available (may require config)"

      - name: Upload binary as artifact
        uses: actions/upload-artifact@v4
        with:
          name: patchmon-agent-${{ matrix.goos }}-${{ matrix.goarch }}
          path: agent-source-code/patchmon-agent-${{ matrix.goos }}-${{ matrix.goarch }}
          retention-days: 1

  release:
    name: Create Release and Upload Binaries
    needs: [check-and-release, build]
    if: needs.check-and-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: binaries
          merge-multiple: false

      - name: Prepare binaries
        run: |
          mkdir -p release-assets
          for dir in binaries/patchmon-agent-*/; do
            cp "${dir}"patchmon-agent-* release-assets/ 2>/dev/null || true
          done
          chmod +x release-assets/*
          echo "📦 Release assets:"
          ls -lh release-assets/

      - name: Create GitHub Release with binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ needs.check-and-release.outputs.tag }}"
          echo "Creating release ${TAG} with binaries..."
          gh release create "${TAG}" \
            --repo "${{ github.repository }}" \
            --title "Agent ${TAG}" \
            --generate-notes \
            --target "${{ github.sha }}" \
            release-assets/*
          echo "✅ Release ${TAG} created with all binaries attached"
